# Buy/sell alerts for liqbrk, delivered with the browser shut.
#
# Runs every 15 minutes. It used to run 5 past every even hour, but GitHub's scheduler delays and drops
# cron runs on quiet repos — measured Oct 2026 the 2-hourly schedule actually fired every 5-6 HOURS, so a
# buy signal could reach you half a day late. Four attempts an hour means a candle close is normally
# reported within minutes. A run that finds no new candle changes nothing and commits nothing.
# The bot drops any still-forming bar, so an early or late run is harmless.
# Position state lives in signals/state.json and is committed back, so each flip alerts once.
# For exact timing, an outside scheduler can also start it — see signals/README.md ("Punctual alerts").
name: liqbrk signals

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and log, send nothing, write no state'
        type: boolean
        default: false
      ping:
        description: 'Send a test message to every configured channel and stop'
        type: boolean
        default: false

concurrency:
  group: liqbrk-signals          # never let two runs race the state file
  cancel-in-progress: false

permissions:
  contents: write                # commit signals/state.json
  issues: write                  # the no-setup fallback channel

jobs:
  signals:
    # ubuntu-latest deliberately: this job is a single dependency-free node script, so the
    # Ubuntu 26 migration is a non-event. Pin only if that ever stops being true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 20 went end-of-life in April 2026; the bot only needs global fetch (18+).
          node-version: '24'

      - name: Check for signals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # the fallback: with no secrets set at all you still get a GitHub issue,
          # which the GitHub mobile app pushes to your phone
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/signal-bot.js ${{ inputs.ping && '--ping' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}

      # always(): an `if:` with no status function gets success() ANDed in, so ONE symbol's
      # fetch failure (which sets exitCode 1 on purpose) would skip the commit — and every alert
      # already sent that run would fire again two hours later, and keep firing until the fetch
      # recovered. The states that did compute are still correct and must be saved.
      - name: Persist position state
        if: ${{ always() && !inputs.dry_run && !inputs.ping }}
        run: |
          if [ -n "$(git status --porcelain signals/state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signals/state.json
            git commit -m "signals: position state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          else
            echo "state unchanged"
          fi
