# Buy/sell alerts for liqbrk, delivered with the browser shut.
#
# Scheduled four times an hour, off the top of the hour: GitHub's docs name the start of every hour as the
# busiest time, when its scheduler delays and drops runs. Even so GitHub runs schedules late or skips them on
# quiet repos. Measured Oct 2026, a 2-hourly schedule fired every 5-6 HOURS. Measured Nov 2026, the 15-minute
# schedule fired only every 3-7 HOURS (Oct 30 to Nov 1: 12 runs, 3 to 7 hours apart), so alerts and the
# journal could trail a candle close by hours. The Portfolio page shows that lag ("The bot is behind"). For
# punctual alerts, let an outside scheduler start it: see signals/README.md ("Punctual alerts").
# A run that finds no new candle changes nothing and commits nothing, and the bot drops any still-forming bar,
# so an early or late run is harmless.
# Position state lives in signals/state.json and is committed back, so each flip alerts once.
name: liqbrk signals

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and log, send nothing, write no state'
        type: boolean
        default: false
      ping:
        description: 'Send a test message to every configured channel and stop'
        type: boolean
        default: false

concurrency:
  group: liqbrk-signals          # never let two runs race the state file
  cancel-in-progress: false

permissions:
  contents: write                # commit signals/state.json
  issues: write                  # the no-setup fallback channel

jobs:
  signals:
    # ubuntu-latest deliberately: this job is a single dependency-free node script, so the
    # Ubuntu 26 migration is a non-event. Pin only if that ever stops being true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 20 went end-of-life in April 2026; the bot only needs global fetch (18+).
          node-version: '24'

      - name: Check for signals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # the fallback: with no secrets set at all you still get a GitHub issue,
          # which the GitHub mobile app pushes to your phone
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/signal-bot.js ${{ inputs.ping && '--ping' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}

      # always(): an `if:` with no status function gets success() ANDed in, so ONE symbol's
      # fetch failure (which sets exitCode 1 on purpose) would skip the commit — and every alert
      # already sent that run would fire again two hours later, and keep firing until the fetch
      # recovered. The states that did compute are still correct and must be saved.
      # state.json + journal.json are the bot's; decisions.json is written by the web page (your Taken /
      # Skipped taps) and can land on main while this job runs, so a plain push may be rejected as not
      # fast-forward. Rebase onto the new main and retry — the files never overlap, so it cannot conflict.
      - name: Persist position state and journal
        if: ${{ always() && !inputs.dry_run && !inputs.ping }}
        run: |
          if [ -n "$(git status --porcelain signals/state.json signals/journal.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signals/state.json signals/journal.json
            git commit -m "signals: position state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3 4; do
              git push && exit 0
              sleep $((i * 3))
              git pull --rebase origin main
            done
            echo "push failed after 4 attempts"; exit 1
          else
            echo "state unchanged"
          fi
